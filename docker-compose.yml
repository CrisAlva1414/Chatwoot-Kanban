services:
  chatwoot-kanban-db:
    image: postgres:16-alpine
    container_name: chatwoot-kanban-db
    restart: unless-stopped
    volumes:
      - kanban_pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kanban}
      POSTGRES_USER: ${POSTGRES_USER:-kanban}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kanban} -d ${POSTGRES_DB:-kanban}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chatwoot_shared

  chatwoot-kanban-app:
    image: ghcr.io/crisalva1414/chatwoot-kanban:main
    container_name: chatwoot-kanban-app
    restart: unless-stopped
    depends_on:
      chatwoot-kanban-db:
        condition: service_healthy
    env_file:
      - .env
    networks:
      - chatwoot_shared
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  kanban_pgdata:

networks:
  chatwoot_shared:
    name: chatwoot_shared
    external: true
