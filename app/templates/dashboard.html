<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
:root {
  --bg-page: 254 254 254;
  --text-primary: 28 32 36;
  --text-secondary: 96 100 108;
  --text-muted: 138 143 155;
  --border: 240 240 243;
  --bg-card: 254 254 254;
  --bg-surface: 245 245 247;
  --accent: 39 129 246;
  --accent-hover: 16 115 233;
  --red: 229 70 102;
  --amber: 255 197 61;
  --green: 18 165 148;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg-page: 20 21 23;
    --text-primary: 237 238 240;
    --text-secondary: 96 100 108;
    --text-muted: 110 115 128;
    --border: 40 42 46;
    --bg-card: 28 29 32;
    --bg-surface: 34 35 38;
    --accent: 39 129 246;
    --accent-hover: 16 115 233;
    --red: 229 70 102;
    --amber: 255 197 61;
    --green: 18 165 148;
  }
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  font-size: 14px;
  color: rgb(var(--text-primary));
  background: rgb(var(--bg-page));
}

.header {
  background: rgb(var(--bg-page));
  border-bottom: 1px solid rgb(var(--border));
  padding: 10px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  position: sticky;
  top: 0;
  z-index: 10;
}
.header h1 { font-size: 15px; font-weight: 600; }
.header .btn {
  padding: 5px 12px;
  font-size: 13px;
  border: 1px solid rgb(var(--border));
  border-radius: 6px;
  background: rgb(var(--bg-card));
  color: rgb(var(--text-secondary));
  text-decoration: none;
  transition: background 0.15s, color 0.15s;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  line-height: 1.4;
}
.header .btn:hover { background: rgb(var(--bg-surface)); color: rgb(var(--text-primary)); }

.container { padding: 24px 16px; max-width: 960px; margin: 0 auto; }

.card-section {
  background: rgb(var(--bg-card));
  border: 1px solid rgb(var(--border));
  border-radius: 8px;
  padding: 16px;
  margin-bottom: 16px;
}
.card-section h2 {
  font-size: 13px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: rgb(var(--text-secondary));
  margin-bottom: 12px;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 12px;
}
.stat-card {
  background: rgb(var(--bg-surface));
  border: 1px solid rgb(var(--border));
  border-radius: 6px;
  padding: 12px;
}
.stat-card .stat-label {
  font-size: 11px;
  color: rgb(var(--text-muted));
  text-transform: uppercase;
  letter-spacing: 0.03em;
}
.stat-card .stat-value {
  font-size: 22px;
  font-weight: 600;
  color: rgb(var(--text-primary));
  margin-top: 2px;
}
.stat-card .stat-sub {
  font-size: 11px;
  color: rgb(var(--text-muted));
  margin-top: 2px;
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}
th {
  text-align: left;
  font-weight: 600;
  color: rgb(var(--text-secondary));
  padding: 8px 10px;
  border-bottom: 1px solid rgb(var(--border));
}
td {
  padding: 8px 10px;
  border-bottom: 1px solid rgb(var(--border));
  color: rgb(var(--text-primary));
}
tr:hover td { background: rgb(var(--bg-surface)); }

.badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 11px;
  font-weight: 500;
}
.badge-create { background: rgb(var(--green) / 0.15); color: rgb(var(--green)); }
.badge-close { background: rgb(var(--accent) / 0.15); color: rgb(var(--accent)); }
.badge-edit { background: rgb(var(--amber) / 0.15); color: rgb(180 120 0); }
.badge-overwrite { background: rgb(var(--red) / 0.1); color: rgb(var(--red)); }
.badge-cron { background: rgb(var(--text-muted) / 0.15); color: rgb(var(--text-secondary)); }
.badge-stage { background: rgb(var(--accent) / 0.15); color: rgb(var(--accent)); }

.loading {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 200px;
  color: rgb(var(--text-muted));
  font-size: 14px;
}
.spinner {
  width: 18px; height: 18px;
  border: 2px solid rgb(var(--border));
  border-top-color: rgb(var(--accent));
  border-radius: 50%;
  animation: spin 0.6s linear infinite;
  margin-right: 8px;
}
@keyframes spin { to { transform: rotate(360deg); } }

.empty { text-align: center; padding: 24px; color: rgb(var(--text-muted)); font-size: 13px; }
</style>
</head>
<body>

<div class="header">
  <a href="/kanban" class="btn">Volver al Kanban</a>
</div>

<div class="container" id="app">
  <div class="loading"><div class="spinner"></div>Cargando…</div>
</div>

<script>
const API_STATS = '/kanban/stats';
const API_HISTORY = '/kanban/stats/history';

function escapeHtml(text) {
  const d = document.createElement('div');
  d.textContent = text;
  return d.innerHTML;
}

function actionBadge(action) {
  const map = {
    create: { label: 'Creada', cls: 'badge-create' },
    close: { label: 'Cerrada', cls: 'badge-close' },
    edit: { label: 'Editada', cls: 'badge-edit' },
    task_overwritten: { label: 'Sobrescrita', cls: 'badge-overwrite' },
    cron_tick: { label: 'Cron', cls: 'badge-cron' },
    cron_transition: { label: 'Cron', cls: 'badge-cron' },
    stage_change: { label: 'Movida', cls: 'badge-stage' },
  };
  const m = map[action] || { label: action, cls: 'badge-cron' };
  return `<span class="badge ${m.cls}">${m.label}</span>`;
}

function timeAgo(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr);
  const now = new Date();
  const diff = now - d;
  const mins = Math.floor(diff / 60000);
  if (mins < 1) return 'ahora';
  if (mins < 60) return `hace ${mins}m`;
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return `hace ${hrs}h`;
  const days = Math.floor(hrs / 24);
  return `hace ${days}d`;
}

async function loadData() {
  const [statsRes, historyRes] = await Promise.all([
    fetch(API_STATS),
    fetch(API_HISTORY),
  ]);
  const stats = await statsRes.json();
  const history = await historyRes.json();
  render(stats.agents || [], history.history || []);
}

function render(agents, history) {
  const app = document.getElementById('app');

  const totalCreated = agents.reduce((s, a) => s + Number(a.tasks_created), 0);
  const totalClosed = agents.reduce((s, a) => s + Number(a.tasks_closed), 0);
  const totalOverwritten = agents.reduce((s, a) => s + Number(a.tasks_overwritten), 0);

  app.innerHTML = `
    <div class="card-section">
      <h2>Resumen</h2>
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-label">Tareas creadas</div>
          <div class="stat-value">${totalCreated}</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Tareas cerradas</div>
          <div class="stat-value">${totalClosed}</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Tareas sobrescritas</div>
          <div class="stat-value">${totalOverwritten}</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Agentes activos</div>
          <div class="stat-value">${agents.length}</div>
        </div>
      </div>
    </div>

    <div class="card-section">
      <h2>Rendimiento por agente</h2>
      ${agents.length === 0
        ? '<div class="empty">No hay datos de agentes todavía.</div>'
        : `<table>
          <thead>
            <tr>
              <th>Agente</th>
              <th>Creadas</th>
              <th>Cerradas</th>
              <th>Sobrescritas</th>
              <th>Cierre OK</th>
            </tr>
          </thead>
          <tbody>
            ${agents.map(a => `
              <tr>
                <td><strong>${escapeHtml(a.nombre)}</strong><br><small style="color:rgb(var(--text-muted))">${escapeHtml(a.email)}</small></td>
                <td>${a.tasks_created}</td>
                <td>${a.tasks_closed}</td>
                <td>${a.tasks_overwritten}</td>
                <td>${a.successful_closes}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>`
      }
    </div>

    <div class="card-section">
      <h2>Historial reciente</h2>
      ${history.length === 0
        ? '<div class="empty">No hay eventos registrados todavía.</div>'
        : `<table>
          <thead>
            <tr>
              <th>Agente</th>
              <th>Acción</th>
              <th>Conversación</th>
              <th>Sync</th>
              <th>Cuándo</th>
            </tr>
          </thead>
          <tbody>
            ${history.map(h => `
              <tr>
                <td>${escapeHtml(h.actor_name)}</td>
                <td>${actionBadge(h.action)}</td>
                <td>${h.conversation_id || '—'}</td>
                <td>${h.chatwoot_call_ok === true ? '✓' : h.chatwoot_call_ok === false ? '✗' : '—'}</td>
                <td>${timeAgo(h.created_at)}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>`
      }
    </div>
  `;
}

loadData().catch(err => {
  document.getElementById('app').innerHTML =
    `<div class="error-banner" style="background:rgb(var(--red) / 0.1);color:rgb(var(--red));border:1px solid rgb(var(--red) / 0.2);border-radius:6px;padding:10px 14px;margin:16px;font-size:13px;">
      <strong>Error:</strong> ${escapeHtml(err.message)}
    </div>`;
});
</script>
</body>
</html>
